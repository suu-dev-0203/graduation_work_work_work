<!-- このファイルがウェブ画面の記述であることをパソコンに教えている -->
<!DOCTYPE html>
<!-- 画面の言葉を日本語に設定しタイムリーフの機能を使えるように住所を指定している -->
<html lang="ja" xmlns:th="http://thymeleaf.org">
<head>
    <!-- 画面の文字が化けて読めなくなるのを防ぐための標準的な暗号化ルールを設定している -->
    <meta charset="UTF-8">
    <!-- ブラウザの一番上のタブに表示されるゲームのタイトル文字を設定している -->
    <title>Java Learning System</title>
    <style>
        /* 画面全体の余計な隙間をゼロにしてスクロールバーの発生を絶対に禁止している */
        html, body {
            margin: 0;
            padding: 0;
            height: 100dvh;
            overflow: hidden;
            background-color: #121212;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #ffffff;
        }
        /* アプリ全体を囲む外枠でFlexboxを使いデスクトップ画面で左右を美しく横並びにする */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        /* 左側の学習設定パネルの横幅を45パーセントに指定し背景を少し明るい黒にしている */
        .left-panel {
            width: 45%;
            height: 100%;
            background-color: #1e1e1e;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #2d2d2d;
        }
        /* 右側のゲーム表示エリアの横幅を55パーセントに分配し暗黒のバトルフィールドにする */
        .right-panel {
            width: 55%;
            height: 100%;
            background-color: #0a0a0a;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        /* 各設定項目を入れるカード型の枠組みで隙間や丸みをコンパクトに整えている */
        .setting-card {
            background-color: #252525;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        /* ゲームタイトルの文字の大きさと鮮やかなネオンミントグリーンの色を設定している */
        .app-title {
            color: #00ffab;
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        /* 選択肢ボタンや項目名の文字サイズを読みやすく16ピクセルに固定している */
        .item-text {
            font-size: 16px;
            color: #cccccc;
            margin-top: 5px;
        }
        /* ゲーム開始ボタンの横幅をいっぱいにしてミントグリーンで目立たせ下部に固定する */
        .start-button {
            width: 100%;
            background-color: #00ffab;
            color: #121212;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: auto;
            text-align: center;
        }
        /* ゲームヘッダー内のスコアやコンボの文字を横一列に並べるための設定 */
        .game-header {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        /* 対戦アリーナの枠線を点線で囲みキャラクターが中央で対峙する空間を作っている */
        .battle-arena {
            flex: 1;
            border: 2px dashed #333333;
            border-radius: 8px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: relative;
        }
        /* 赤く発光する5マスの敵HPゲージの四角い形とネオンの影を設定している */
        .hp-bar {
            display: flex;
            gap: 5px;
        }
        .hp-block {
            width: 20px;
            height: 15px;
            background-color: #ff3333;
            box-shadow: 0 0 8px #ff3333;
            border-radius: 2px;
        }
        /* 体力が減ったときにマスを消灯させて黒くするための設定 */
        .hp-block.empty {
            background-color: #331111;
            box-shadow: none;
        }
        /* 状態切り替えのためにエリアを非表示にする設定 */
        .state-area {
            display: none;
        }
        /* アクティブなクラスが付いたエリアだけを画面に出現させる設定 */
        .state-area.active {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- アプリ全体の左右分割コンテナの開始 -->
    <div class="app-container">
        <!-- 左側の情報パネルの開始 -->
        <div class="left-panel">
            <!-- ゲームのタイトル文字を表示している -->
            <div class="app-title">Java Learning System</div>
            <!-- 初期状態のホーム画面エリアの開始 -->
            <div id="area-home" class="state-area active">

                <!-- 1番目の設定：学習テーマを選択するカード -->
                <div class="setting-card">
                    <h3>1. 学習テーマ（Chapter）</h3>
                    <!-- Javaから届いた章データを1つずつ取り出してループ表示する -->
                    <div th:each="ch : ${chapters}">
                        <!-- データベースから読み込んだ章の名前を画面に表示する -->
                        <div class="item-text" th:text="${ch.name}">ここに本物の章の名前が入ります</div>
                    </div>
                </div>
                <!-- 2番目の設定：出題方法の案内カード -->
                <div class="setting-card">
                    <h3>2. 出題方法</h3>
                    <div class="item-text">ランダム / 基礎 / コード読解</div>
                </div>

                <!-- 3番目の設定：プレイ問題数の選択カード -->
                <div class="setting-card">
                    <h3>3. 問題数</h3>
                    <div class="item-text">5問 / 10問 / 15問 / 20問</div>
                </div>
                <!-- ゲーム本番を開始するためのミントグリーンのボタン -->
                <button class="start-button" onclick="startGame()">ゲーム開始</button>
            </div>
            <!-- ゲーム開始後に切り替わる問題エリアの開始 -->
            <div id="area-game" class="state-area">
                <!-- 現在の進行状況を示す見出し -->
                <h2 id="stage-info">第1章 / Stage 1 / 第1問目</h2>
                <!-- クイズの問題文が大きく表示される場所 -->
                <p id="question-text" style="font-size: 18px; margin-bottom: 20px;">Javaのプログラムの実行方法を最も適切に説明しているものはどれですか？</p>

                <!-- 選択肢を縦並びの箇条書き形式で配置するエリア -->
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <!-- 選択肢Aのボタンで正解テスト用の処理を紐付けている -->
                    <button class="start-button" style="background-color: #252525; color: white; text-align: left;" onclick="testHit()">A. ソースコードをバイトコードにコンパイルしJVMで実行する</button>
                    <!-- 選択肢Bのボタンで不正解テスト用の処理を紐付けている -->
                    <button class="start-button" style="background-color: #252525; color: white; text-align: left;" onclick="testMiss()">B. ソースコードをOSが直接実行する</button>
                    <button class="start-button" style="background-color: #252525; color: white; text-align: left;" onclick="testMiss()">C. ソースコードを必ずC言語へ変換して実行する</button>
                    <button class="start-button" style="background-color: #252525; color: white; text-align: left;" onclick="testMiss()">D. コンパイルせずJVMも使わずに実行する</button>
                    <button class="start-button" style="background-color: #252525; color: white; text-align: left;" onclick="testMiss()">E. 実行前にソースコードを手作業で機械語へ書き換える</button>
                </div>
            </div>
        </div>
        <!-- 右側のゲーム演出パネルの開始 -->
        <div class="right-panel">
            <!-- スコア、コンボ、敵体力を一列に並べる上部ヘッダー -->
            <div class="game-header">
                <span style="color: #00ffab;">SCORE: <span id="score-val">0</span></span>
                <span style="color: #ffaa00;">COMBO: <span id="combo-val">0</span></span>
                <!-- 敵の体力を示す独立した5マスのブロック列 -->
                <div class="hp-bar">
                    <span style="color: #ff3333; margin-right: 10px;">ENEMY HP</span>
                    <div id="hp1" class="hp-block"></div>
                    <div id="hp2" class="hp-block"></div>
                    <div id="hp3" class="hp-block"></div>
                    <div id="hp4" class="hp-block"></div>
                    <div id="hp5" class="hp-block"></div>
                </div>
            </div>
            <!-- キャラクター同士が対峙するメイン戦闘フィールド -->
            <div class="battle-arena">
                <div style="font-size: 50px; text-align: center;">🧙<br><span style="font-size: 14px; background: #333; padding: 2px 5px; border-radius: 4px;">PLAYER</span></div>
                <div style="font-size: 24px; color: #444;">VS</div>
                <div style="font-size: 50px; text-align: center;">🤖<br><span style="font-size: 14px; background: #333; padding: 2px 5px; border-radius: 4px;">JAVA_ROBOT</span></div>
            </div>
            <!-- 戦闘のヒットやミスのログメッセージがリアルタイムに表示される下部エリア -->
            <div id="effect-zone" style="margin-top: 20px; padding: 15px; background: #151515; border-radius: 8px; text-align: center; font-size: 18px; color: #00ffab;">
                待機中: クエストを選択してください
            </div>
        </div>
    </div>
    <!-- ========================================================================= -->
    <!-- 即時判定およびクイズ自動入れ替えシステム（JavaScript） -->
    <!-- ========================================================================= -->
    <script>
        /* ゲーム中に変化する数値を保存する変数 */
        let currentHp = 5;
        let currentScore = 0;
        let currentCombo = 0;

        // Java側から受け取った問題データを一時保存する配列
        let localQuestions = [];
        // 現在何問目に挑戦しているかを保存する（最初は0番目）
        let currentQuestionIndex = 0;

        /* APIから問題データを取得し、問題画面へ切り替える処理 */
        function startGame() {
            // Java側のAPIが定義しているURLに合わせ、章ID「1」の問題を取得する
            fetch('/api/questions/chapter/1')
                // サーバーから返ってきたJSONをJavaScriptのデータに変換する
                .then(response => response.json())
                // 取得した問題データを保存して、問題画面を表示する
                .then(data => {
                    localQuestions = data;
                    currentQuestionIndex = 0;

                    // HOME画面を隠し、ゲームの問題画面を表示する
                    document.getElementById("area-home").classList.remove("active");
                    document.getElementById("area-game").classList.add("active");

                    // メッセージ欄にバトル開始を表示する
                    const effectZone = document.getElementById("effect-zone");
                    effectZone.classList.add("effect-active");
                    effectZone.innerText = "⚔️ バトル開始！回答を選択してください";

                    // 問題が1問以上取得できたときだけ、最初の問題を表示する
                    if (localQuestions.length > 0) {
                        renderQuestion();
                    } else {
                        effectZone.innerText = "⚠️ クイズデータがデータベースにありません";
                    }
                });
        }

        /* 取得した問題文と選択肢を画面へ表示する処理 */
        function renderQuestion() {
            // 配列から、現在表示する問題を取り出す
            const q = localQuestions[currentQuestionIndex];

            // 現在の問題番号と全体の問題数を表示する
            document.getElementById("stage-info").innerText = "第1章 / Stage 1 / 第" + (currentQuestionIndex + 1) + "問目 (全" + localQuestions.length + "問)";
            // データベースから受け取った問題文を表示する
            document.getElementById("question-text").innerText = q.questionText;

            // 問題画面の中にある選択肢ボタン（A～E）を取得する
            const buttons = document.querySelectorAll("#area-game button");

            // APIから受け取った選択肢を、A～Eの順番で配列にまとめる
            const choices = [q.choiceA, q.choiceB, q.choiceC, q.choiceD, q.choiceE];
            const choiceLabels = ["A", "B", "C", "D", "E"];

            // 問題によって選択肢の数が違うため、値があるボタンだけ表示する
            buttons.forEach((button, index) => {
                const choice = choices[index];

                // null、undefined、空文字は未登録の選択肢として扱う
                if (choice === null || choice === undefined || String(choice).trim() === "") {
                    button.style.display = "none";
                } else {
                    // 次の問題に選択肢がある場合は、ボタンを再表示する
                    button.style.display = "";
                    button.innerText = choiceLabels[index] + ". " + choice;
                }
            });

            // 回答を待っていることをメッセージ欄に表示する
            document.getElementById("effect-zone").innerText = "⚔️ 第" + (currentQuestionIndex + 1) + "問目！回答を選択してください";
        }

        // 正解ボタンが押されたとき、敵HP・スコア・コンボを更新する（現在は仮の正解処理）
        function testHit() {
            if (currentHp > 0) {
                document.getElementById("hp" + currentHp).classList.add("empty");
                currentHp = currentHp - 1;
                currentScore = currentScore + 100;
                currentCombo = currentCombo + 1;

                document.getElementById("score-val").innerText = currentScore;
                document.getElementById("combo-val").innerText = currentCombo;
                document.getElementById("effect-zone").innerText = "💥 クリティカルヒット！敵に1ダメージ！";

                if (currentHp === 0) {
                    document.getElementById("effect-zone").innerText = "🎉 PERFECT STAGE CLEAR！";
                }

                // 回答後、次の問題へ進む処理を呼び出す
                checkNextQuestion();
            }
        }

        // 不正解ボタンが押されたとき、コンボを0に戻す（現在は仮の不正解処理）
        function testMiss() {
            currentCombo = 0;
            document.getElementById("combo-val").innerText = currentCombo;
            document.getElementById("effect-zone").innerText = "❌ MISS！コンボが途切れてしまった！";

            // 回答後、次の問題へ進む処理を呼び出す
            checkNextQuestion();
        }

        /* 少し待ってから次の問題へ進める処理 */
        function checkNextQuestion() {
            // 次の問題番号に進める
            currentQuestionIndex = currentQuestionIndex + 1;

            // まだ問題が残っている場合は、1.5秒後に次の問題を表示する
            if (currentQuestionIndex < localQuestions.length) {
                setTimeout(renderQuestion, 1500);
            } else {
                // すべての問題が終わったら、終了メッセージを表示する
                setTimeout(() => {
                    document.getElementById("effect-zone").innerText = "🏁 全問のステージが終了しました！";
                }, 1500);
            }
        }
    </script>
</body>
</html>
