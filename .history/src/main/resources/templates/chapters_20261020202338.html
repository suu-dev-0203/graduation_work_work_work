<!DOCTYPE html>
<html lang="ja" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Java Learning System</title>
    <style>
        /* === ① 画面全体のリセット（スクロール絶対禁止の盾） === */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh; /* ブラウザの画面ぴったりに固定 */
            overflow: hidden; /* スクロールバーを強制禁止 */
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121214;
            color: #ffffff;
        }

        /* === ② アプリ全体のコンテナ === */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* === ③ 左側パネル（横幅 45% 固定） === */
        .left-panel {
            width: 45%;
            height: 100%;
            background-color: #1a1a1e;
            box-sizing: border-box;
            padding: 24px;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #2a2a30;
            position: relative;
        }

        .state-area {
            display: none;
            flex-direction: column;
            height: 100%;
            gap: 20px;
        }

        .state-area.active {
            display: flex;
        }

        /* === ④ 右側：ゲームエリア（横幅 55% 固定・サイバー格好いい戦闘フィールド） === */
        .right-panel {
            width: 55%;
            height: 100%;
            background-color: #0c0c0e; /* より深い黒 */
            box-sizing: border-box;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* 上部にUI、中央に戦闘、下部に演出 */
            align-items: center;
            position: relative;
        }

        /*  ゲームエリア内の上部UI（Score, Combo, HP）  */
        .game-header-ui {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, #16161a 0%, #111114 100%);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #22222a;
            box-sizing: border-box;
        }
        
        .ui-stats {
            display: flex;
            gap: 20px;
            font-size: 16px;
            font-weight: bold;
        }
        .stat-score { color: #4af6c3; } /* ミントグリーン */
        .stat-combo { color: #ffaa00; } /* オレンジゴールド */

        /* 💔 敵HPゲージ（必ず5マスの固定ブロック仕様）  */
        .enemy-hp-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hp-label {
            font-size: 14px;
            font-weight: bold;
            color: #ff5555;
        }
        .hp-bar-slots {
            display: flex;
            gap: 4px;
        }
        .hp-slot {
            width: 24px;
            height: 14px;
            background-color: #ff3333; /* 赤く燃えるHPタンク */
            border-radius: 3px;
            box-shadow: 0 0 8px #ff3333; /* ネオンの輝き */
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        /* HPが減った時の空枠スタイル（テスト用） */
        .hp-slot.empty {
            background-color: #222226;
            box-shadow: none;
        }

        /* 🏜️ 中央の戦闘フィールド（アリーナ）  */
        .battle-arena {
            width: 100%;
            flex-grow: 1;
            margin: 20px 0;
            background: radial-gradient(circle, #1a1a24 0%, #0c0c0e 70%);
            border-radius: 12px;
            border: 1px dashed #3a3a45;
            position: relative;
            display: flex;
            justify-content: space-around; /* プレイヤーと敵を左右に配置 */
            align-items: center;
            box-sizing: border-box;
        }

        /* 💎 プレイヤーキャラクター（仮のサイバー図形マテリアル）  */
        .character-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .player-avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #00d2ff 0%, #0066ff 100%);
            border: 2px solid #ffffff;
            border-radius: 12px;
            box-shadow: 0 0 15px #00d2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
        }

        /* 👿 敵キャラクター（エネミーマテリアル）  */
        .enemy-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ff0055 0%, #990022 100%);
            border: 2px solid #ff5555;
            border-radius: 50%; /* 丸いモンスターコア */
            box-shadow: 0 0 15px #ff0055;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
        }
        .char-label {
            font-size: 12px;
            font-weight: bold;
            background-color: #16161a;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #33333b;
        }

        /* 💥 下部：ゲーム効果・演出通知テキスト  */
        .battle-effect-zone {
            width: 100%;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #888899;
            padding: 8px;
            background-color: #111114;
            border-radius: 6px;
            border: 1px solid #1c1c22;
            box-sizing: border-box;
        }
        .effect-active {
            color: #4af6c3;
            text-shadow: 0 0 10px #4af6c3;
        }

        /* === ⑤ 左側装飾パーツ === */
        h1, h2 {
            font-size: 20px;
            margin: 0;
            color: #4af6c3;
        }
        .stage-info {
            font-size: 14px;
            color: #aaaaaa;
        }
        .setting-section, .question-card {
            background-color: #26262b;
            padding: 16px;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .choice-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0;
            margin: 0;
            list-style: none;
        }
        .choice-button {
            background-color: #32323a;
            color: #ffffff;
            border: 1px solid #44444c;
            padding: 12px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            font-size: 15px;
        }
        .bottom-button {
            background-color: #4af6c3;
            color: #121214;
            font-size: 18px;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: auto;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- ========================================================================= -->
        <!-- 左側パネル：問題エリア（前回作った切り替え機構をそのまま完全維持） -->
        <!-- ========================================================================= -->
        <div class="left-panel">
            
            <!-- 【状態：HOME】 -->
            <div id="area-home" class="state-area active">
                <h1>Java Learning System</h1>
                
                <div class="setting-section">
                    <h3>1. 学習テーマ（Chapter）</h3>
                    <ul>
                        <li th:each="ch : ${chapters}" th:text="${ch.name}">第1章：Javaの基本</li>
                    </ul>
                </div>

                <div class="setting-section">
                    <h3>2. 出題方法</h3>
                    <p>ランダム / 基礎 / コード読解</p>
                </div>

                <div class="setting-section">
                    <h3>3. 問題数</h3>
                    <p>5問 / 10問 / 15問 / 20問</p>
                </div>

                <button class="bottom-button" onclick="startGame()">ゲーム開始</button>
            </div>

            <!-- 【状態：ANSWERING】 -->
            <div id="area-game" class="state-area">
                <div class="stage-info">第1章 / Stage 1 / 第1問目 (全5問)</div>
                <h2>問題文：Javaのソースコードをコンパイルした後に生成されるファイルはどれか？</h2>
                
                <div class="question-card" style="font-family: monospace; background-color: #000000; color: #00ff00;">
                    // [コード読解用テンプレート]<br>
                    System.out.println("Hello World");
                </div>

                <ul class="choice-list">
                    <li><button class="choice-button" onclick="testHit()">A. .exeファイル（テスト：正解を試す）</button></li>
                    <li><button class="choice-button" onclick="testMiss()">B. .classファイル（テスト：不正解を試す）</button></li>
                    <li><button class="choice-button">C. .javaファイル</button></li>
                    <li><button class="choice-button">D. .txtファイル</button></li>
                    <li><button class="choice-button">E. .binファイル</button></li>
                </ul>

                <button class="bottom-button" style="background-color: #ff5555; color: white;" onclick="backToHome()">一時停止して戻る</button>
            </div>

        </div>

        <!-- ========================================================================= -->
        <!-- 右側パネル：肉付けされたサイバーゲームエリア（Source of Truth完全準拠） -->
        <!-- ========================================================================= -->
        <div class="right-panel">
            
            <!-- ① 上部ステータスUI：Score、Combo、そして5マスの敵HP -->
            <div class="game-header-ui">
                <div class="ui-stats">
                    <span class="stat-score">SCORE: <span id="text-score">0</span></span>
                    <span class="stat-combo">COMBO: <span id="text-combo">0</span></span>
                </div>
                
                <!-- 敵HP：必ず5マスのブロック列 -->
                <div class="enemy-hp-container">
                    <span class="hp-label">ENEMY HP</span>
                    <div class="hp-bar-slots">
