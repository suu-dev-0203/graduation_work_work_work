<!DOCTYPE html>
<html lang="ja" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Java Learning System - HOME</title>
    <style>
        /* === ① 画面全体のリセット（スクロールバーを絶対にインさせない基本盾） === */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh; /* 動的ビューポート高さを使い、ブラウザの画面ぴったりに固定 */
            overflow: hidden; /* 画面外へのはみ出しとスクロールを強制禁止 */
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121214; /* ゲームらしいダークな背景色 */
            color: #ffffff;
        }

        /* === ② アプリ全体のコンテナ（左右を横並びにする司令塔） === */
        .app-container {
            display: flex; /* 左右のパネルを横並び（Flexbox）にする設定 */
            width: 100%;
            height: 100%;
        }

        /* === ③ 左側：学習設定エリア（画面の 45% を使う） === */
        .left-panel {
            width: 45%;
            height: 100%;
            background-color: #1a1a1e; /* 右側より少しだけ明るい暗色 */
            box-sizing: border-box;
            padding: 24px;
            display: flex;
            flex-direction: column; /* 設定項目を上から下へ縦に綺麗に並べる */
            justify-content: flex-start;
            gap: 20px; /* 項目ごとの隙間を一定にして、無駄な余白をカット */
            border-right: 2px solid #2a2a30; /* 左右の境界線 */
        }

        /* === ④ 右側：ゲームエリア（画面の 55% を使う） === */
        .right-panel {
            width: 55%;
            height: 100%;
            background-color: #0f0f11; /* 深い闇、戦闘フィールドの背景 */
            box-sizing: border-box;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center; /* キャラクターや敵を画面の上下中央に配置 */
            align-items: center;
        }

        /* === ⑤ 文字やパーツのコンパクト化（スクロールさせないための調整） === */
        h1 {
            font-size: 20px;
            margin: 0 0 10px 0;
            color: #4af6c3; /* 綺麗なセーフティグリーン */
        }
        .setting-section {
            background-color: #26262b;
            padding: 16px;
            border-radius: 8px;
        }
        .start-button {
            background-color: #4af6c3;
            color: #121214;
            font-size: 18px;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: auto; /* ボタンを一番下へ自動的に押し下げる */
        }
        .game-placeholder {
            border: 2px dashed #4af6c3;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            color: #4af6c3;
        }
    </style>
</head>
<body>

    <!-- アプリ全体の大きさを画面ぴったりに固定する外枠 -->
    <div class="app-container">

        <!-- 左側：学習設定（HOME画面の状態） -->
        <div class="left-panel">
            <h1>Java Learning System</h1>
            
            <!-- 学習テーマ選択の見た目（仮） -->
            <div class="setting-section">
                <h3>1. 学習テーマ（Chapter）</h3>
                <ul>
                    <!-- データベースから届いた本物の章の名前をここに箇条書きで出す -->
                    <li th:each="ch : ${chapters}" th:text="${ch.name}">第1章：変数とデータ型</li>
                </ul>
            </div>

            <!-- 出題方法選択の見た目（仮） -->
            <div class="setting-section">
                <h3>2. 出題方法</h3>
                <p>ランダム / 基礎 / コード読解</p>
            </div>

            <!-- 問題数選択の見た目（仮） -->
            <div class="setting-section">
                <h3>3. 問題数</h3>
                <p>5問 / 10問 / 15問 / 20問</p>
            </div>

            <!-- ゲーム開始ボタン（最下部にコンパクトに配置） -->
            <button class="start-button">ゲーム開始</button>
        </div>

        <!-- 右側：ゲームエリア（世界観を見せるエリア） -->
        <div class="right-panel">
            <div class="game-placeholder">
                <h3> ゲームエリア </h3>
                <p>プレイヤー  vs  敵</p>
                <p>敵HP: 5 / Combo: 0 / Score: 0</p>
                <p>（ここに独自素材やシンプルなアイコンが動く世界を作ります）</p>
            </div>
        </div>

    </div>

</body>
</html>
